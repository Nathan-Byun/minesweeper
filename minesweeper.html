<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e2230">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>지뢰찾기</title>
<style>
  :root {
    --bg: #1e2230;
    --panel: #2a3042;
    --cell: #3b4460;
    --cell-hover: #4a5576;
    --open: #e8ebf2;
    --text: #f2f4f8;
    --accent: #ffb347;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    user-select: none;
    padding: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: 2px; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    background: var(--panel); color: var(--text); border: 1px solid #444c66;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .controls button.active { background: var(--accent); color: #222; border-color: var(--accent); }
  .status {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); padding: 8px 14px; border-radius: 8px 8px 0 0;
    font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  #face { font-size: 26px; cursor: pointer; background: none; border: none; padding: 0 8px; }
  .board-wrap { background: var(--panel); padding: 10px; border-radius: 0 0 8px 8px; overflow-x: auto; max-width: 100%; }
  #board { display: grid; gap: 2px; touch-action: manipulation; -webkit-touch-callout: none; }
  .cell {
    width: var(--size, 30px); height: var(--size, 30px); background: var(--cell); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: calc(var(--size, 30px) * 0.55); cursor: pointer;
  }
  .flag-btn {
    margin-top: 10px; background: var(--panel); color: var(--text); border: 2px solid #444c66;
    padding: 10px 22px; border-radius: 10px; cursor: pointer; font-size: 17px; font-weight: bold;
  }
  .flag-btn.on { background: #d94848; border-color: #ff7070; }
  .cell:hover:not(.open) { background: var(--cell-hover); }
  .cell.open { background: var(--open); cursor: default; }
  .cell.mine-hit { background: #ff5c5c; }
  .cell.wrong-flag { background: #ffb3b3; }
  .n1 { color: #1e6fd9; } .n2 { color: #2e9e44; } .n3 { color: #d93a3a; } .n4 { color: #5b2bb5; }
  .n5 { color: #a0522d; } .n6 { color: #1a9a9a; } .n7 { color: #222; }    .n8 { color: #777; }
  #message { margin-top: 12px; height: 24px; font-size: 18px; font-weight: bold; }
  .sound-btn {
    margin-top: 4px; background: var(--panel); color: var(--text); border: 1px solid #444c66;
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .help { margin-top: 6px; font-size: 13px; opacity: 0.7; text-align: center; }
</style>
</head>
<body>
  <h1>💣 지뢰찾기</h1>

  <div class="controls">
    <button data-level="easy" class="active">초급 (9×9)</button>
    <button data-level="medium">중급 (16×16)</button>
    <button data-level="hard">고급 (30×16)</button>
    <button data-level="expert">전문가 (30×20)</button>
    <button data-level="hell">🔥 지옥 (30×24)</button>
  </div>

  <div>
    <div class="status">
      <span id="mines-left">💣 010</span>
      <button id="face" title="새 게임">🙂</button>
      <span id="timer">⏱ 000</span>
    </div>
    <div class="board-wrap"><div id="board"></div></div>
  </div>

  <button id="flag-mode" class="flag-btn">⛏️ 열기 모드</button>
  <div id="message"></div>
  <button id="sound" class="sound-btn">🔊 소리 켜짐</button>
  <div class="help">
    왼쪽 클릭: 칸 열기 · 오른쪽 클릭: 깃발 · 숫자 칸 클릭: 주변 자동 열기<br>
    (폰: 길게 누르기 또는 아래 버튼으로 깃발 모드 전환)
  </div>

<script>
const LEVELS = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 },
  expert: { rows: 20, cols: 30, mines: 145 },  // 지뢰 밀도 약 24%
  hell:   { rows: 24, cols: 30, mines: 200 },  // 지뢰 밀도 약 28%
};

const boardEl = document.getElementById('board');
const minesLeftEl = document.getElementById('mines-left');
const timerEl = document.getElementById('timer');
const faceEl = document.getElementById('face');
const messageEl = document.getElementById('message');

let level = 'easy';
let rows, cols, mineCount;
let grid;          // 2차원 배열: { mine, open, flag, count, el }
let firstClick, gameOver, openedCount, flagCount;
let timer = null, seconds = 0;

// ===== 효과음 (Web Audio API로 직접 합성, 별도 파일 필요 없음) =====
let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('ms-sound') !== 'off'; } catch (e) {}

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 단음: 주파수, 길이(초), 옵션(파형, 볼륨, 시작 지연, 끝 주파수)
function tone(freq, dur, { type = 'sine', vol = 0.15, delay = 0, slideTo = null } = {}) {
  const ac = ctx();
  const t = ac.currentTime + delay;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// 잡음 (폭발음용)
function noise(dur, vol) {
  const ac = ctx();
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3000, ac.currentTime);
  filter.frequency.exponentialRampToValueAtTime(100, ac.currentTime + dur);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(vol, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(filter).connect(gain).connect(ac.destination);
  src.start();
}

const SFX = {
  open:    () => tone(650, 0.05, { type: 'square', vol: 0.06 }),
  cascade: () => { tone(500, 0.07, { type: 'triangle' }); tone(750, 0.07, { type: 'triangle', delay: 0.05 }); tone(1000, 0.1, { type: 'triangle', delay: 0.1 }); },
  flag:    () => tone(900, 0.09, { type: 'triangle', slideTo: 1400 }),
  unflag:  () => tone(1200, 0.09, { type: 'triangle', slideTo: 700 }),
  boom:    () => { noise(1.0, 0.6); tone(140, 0.7, { type: 'sawtooth', vol: 0.25, slideTo: 30 }); },
  win:     () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) =>
             tone(f, i === 5 ? 0.45 : 0.15, { type: 'square', vol: 0.08, delay: i * 0.12 })),
  newGame: () => { tone(400, 0.06, { type: 'triangle' }); tone(600, 0.08, { type: 'triangle', delay: 0.06 }); },
};

function play(name) {
  if (!soundOn) return;
  try { SFX[name](); } catch (e) { /* 소리 재생 실패는 게임에 영향 없음 */ }
}

const soundBtn = document.getElementById('sound');
function updateSoundBtn() { soundBtn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; }
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('ms-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  updateSoundBtn();
  play('open');
});
updateSoundBtn();

function pad(n) { return String(Math.max(0, Math.min(999, n))).padStart(3, '0'); }

function newGame() {
  ({ rows, cols, mines: mineCount } = LEVELS[level]);
  grid = [];
  firstClick = true;
  gameOver = false;
  openedCount = 0;
  flagCount = 0;
  stopTimer();
  seconds = 0;
  timerEl.textContent = '⏱ 000';
  faceEl.textContent = '🙂';
  messageEl.textContent = '';
  updateMinesLeft();

  boardEl.innerHTML = '';
  // 화면 폭에 맞춰 칸 크기 조절 (너무 작아지면 가로 스크롤)
  const size = Math.max(28, Math.min(40, Math.floor((window.innerWidth - 56) / cols) - 2));
  boardEl.style.setProperty('--size', size + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;

  for (let r = 0; r < rows; r++) {
    grid.push([]);
    for (let c = 0; c < cols; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.r = r;
      el.dataset.c = c;
      grid[r].push({ mine: false, open: false, flag: false, count: 0, el });
      boardEl.appendChild(el);
    }
  }
}

// 첫 클릭 칸과 그 주변에는 지뢰를 놓지 않음
function placeMines(safeR, safeC) {
  const candidates = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (Math.abs(r - safeR) > 1 || Math.abs(c - safeC) > 1) candidates.push([r, c]);

  // Fisher–Yates 셔플 후 앞에서부터 지뢰 배치
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  for (let i = 0; i < mineCount; i++) {
    const [r, c] = candidates[i];
    grid[r][c].mine = true;
  }

  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      grid[r][c].count = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
}

function neighbors(r, c) {
  const list = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) list.push([nr, nc]);
    }
  return list;
}

function openCell(r, c) {
  const cell = grid[r][c];
  if (cell.open || cell.flag) return;

  if (firstClick) {
    placeMines(r, c);
    firstClick = false;
    startTimer();
  }

  if (cell.mine) {
    cell.el.classList.add('mine-hit');
    lose();
    return;
  }

  // 빈 칸이면 주변을 연쇄적으로 열기 (스택 기반 flood fill)
  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const cur = grid[cr][cc];
    if (cur.open || cur.flag) continue;
    cur.open = true;
    openedCount++;
    renderCell(cur);
    if (cur.count === 0) {
      for (const [nr, nc] of neighbors(cr, cc))
        if (!grid[nr][nc].open && !grid[nr][nc].mine) stack.push([nr, nc]);
    }
  }

  checkWin();
}

// 숫자 칸 클릭 시: 주변 깃발 수가 숫자와 같으면 나머지 칸을 모두 열기
function chord(r, c) {
  const cell = grid[r][c];
  if (!cell.open || cell.count === 0) return;
  const around = neighbors(r, c);
  const flags = around.filter(([nr, nc]) => grid[nr][nc].flag).length;
  if (flags !== cell.count) return;
  for (const [nr, nc] of around) {
    if (gameOver) return;
    openCell(nr, nc);
  }
}

function toggleFlag(r, c) {
  const cell = grid[r][c];
  if (cell.open || gameOver) return;
  cell.flag = !cell.flag;
  flagCount += cell.flag ? 1 : -1;
  cell.el.textContent = cell.flag ? '🚩' : '';
  play(cell.flag ? 'flag' : 'unflag');
  updateMinesLeft();
}

function renderCell(cell) {
  cell.el.classList.add('open');
  if (cell.count > 0) {
    cell.el.textContent = cell.count;
    cell.el.classList.add('n' + cell.count);
  } else {
    cell.el.textContent = '';
  }
}

function updateMinesLeft() {
  const left = mineCount - flagCount;
  minesLeftEl.textContent = '💣 ' + (left < 0 ? '-' + pad(-left).slice(1) : pad(left));
}

function startTimer() {
  timer = setInterval(() => {
    seconds++;
    timerEl.textContent = '⏱ ' + pad(seconds);
  }, 1000);
}
function stopTimer() { clearInterval(timer); timer = null; }

function revealAll() {
  for (const row of grid)
    for (const cell of row) {
      if (cell.mine && !cell.flag) {
        cell.el.classList.add('open');
        cell.el.textContent = '💣';
      } else if (!cell.mine && cell.flag) {
        cell.el.classList.add('wrong-flag');
        cell.el.textContent = '❌';
      }
    }
}

function lose() {
  gameOver = true;
  stopTimer();
  revealAll();
  play('boom');
  faceEl.textContent = '😵';
  messageEl.textContent = '💥 지뢰를 밟았습니다! 얼굴을 눌러 다시 시작하세요.';
}

function checkWin() {
  if (openedCount !== rows * cols - mineCount) return;
  gameOver = true;
  stopTimer();
  // 남은 지뢰에 자동으로 깃발 표시
  for (const row of grid)
    for (const cell of row)
      if (cell.mine && !cell.flag) { cell.flag = true; cell.el.textContent = '🚩'; }
  flagCount = mineCount;
  updateMinesLeft();
  play('win');
  faceEl.textContent = '😎';
  messageEl.textContent = `🎉 승리! 기록: ${seconds}초`;
}

// ===== 입력 처리 =====
function cellFromEvent(e) {
  const el = e.target.closest('.cell');
  return el ? [Number(el.dataset.r), Number(el.dataset.c)] : null;
}

boardEl.addEventListener('click', (e) => {
  if (gameOver || suppressClick) { suppressClick = false; return; }
  const pos = cellFromEvent(e);
  if (!pos) return;
  const [r, c] = pos;
  if (flagMode && !grid[r][c].open) { toggleFlag(r, c); return; }
  const before = openedCount;
  if (grid[r][c].open) chord(r, c);
  else openCell(r, c);
  // 폭발/승리음은 lose()/checkWin()에서 재생
  if (!gameOver) {
    const opened = openedCount - before;
    if (opened > 1) play('cascade');
    else if (opened === 1) play('open');
  }
});

boardEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  // 폰에서 길게 누르면 contextmenu도 발생하므로, 터치 직후에는 무시 (깃발이 두 번 토글되는 것 방지)
  if (Date.now() - lastTouch < 1000) return;
  const pos = cellFromEvent(e);
  if (pos) toggleFlag(...pos);
});

boardEl.addEventListener('mousedown', (e) => {
  if (!gameOver && e.button === 0) faceEl.textContent = '😮';
});
document.addEventListener('mouseup', () => {
  if (!gameOver) faceEl.textContent = '🙂';
});

// 모바일: 길게 누르면 깃발
let pressTimer = null, suppressClick = false, lastTouch = 0;
boardEl.addEventListener('touchstart', (e) => {
  lastTouch = Date.now();
  const pos = cellFromEvent(e);
  if (!pos) return;
  pressTimer = setTimeout(() => {
    toggleFlag(...pos);
    suppressClick = true;
    if (navigator.vibrate) navigator.vibrate(30);
  }, 400);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(ev =>
  boardEl.addEventListener(ev, () => clearTimeout(pressTimer)));

// 깃발 모드: 켜져 있으면 탭 한 번으로 깃발 꽂기
let flagMode = false;
const flagBtn = document.getElementById('flag-mode');
flagBtn.addEventListener('click', () => {
  flagMode = !flagMode;
  flagBtn.classList.toggle('on', flagMode);
  flagBtn.textContent = flagMode ? '🚩 깃발 모드' : '⛏️ 열기 모드';
  play(flagMode ? 'flag' : 'unflag');
});

faceEl.addEventListener('click', () => { newGame(); play('newGame'); });

document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    newGame();
    play('newGame');
  });
});

newGame();

// 앱 설치(오프라인 실행)용 서비스 워커 — 웹 주소(https)로 열었을 때만 동작, 파일로 열면 건너뜀
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
